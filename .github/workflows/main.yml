name: CyberOpsLock APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build CyberOpsLock debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's hosted runner already includes the Android SDK.
      # Avoid android-actions/setup-android here because its setup currently
      # tries to install the obsolete standalone SDK package named "tools".
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found in $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          license_status=${PIPESTATUS[1]}
          if [ "$license_status" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed with exit code $license_status"
            exit "$license_status"
          fi

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if { [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; } && [ -d "app" ]; then
            PROJECT_DIR="."
          elif { [ -f "CyberOpsLock/settings.gradle" ] || [ -f "CyberOpsLock/settings.gradle.kts" ]; } && [ -d "CyberOpsLock/app" ]; then
            PROJECT_DIR="CyberOpsLock"
          else
            echo "::error::Could not find Android project root with settings.gradle(.kts) and app/."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Ensure AndroidX is enabled
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          if [ ! -f gradle.properties ]; then
            touch gradle.properties
          fi
          if grep -qE '^[[:space:]]*android\.useAndroidX[[:space:]]*=' gradle.properties; then
            sed -i -E 's/^[[:space:]]*android\.useAndroidX[[:space:]]*=.*/android.useAndroidX=true/' gradle.properties
          else
            printf '\nandroid.useAndroidX=true\n' >> gradle.properties
          fi
          echo "AndroidX enabled for this CI build."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberOpsLock-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
