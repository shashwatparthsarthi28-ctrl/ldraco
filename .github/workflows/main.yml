name: CyberOpsLock APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build CyberOpsLock debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do NOT use android-actions/setup-android here:
      # its current setup step calls `sdkmanager tools`, which fails because
      # the old standalone "tools" SDK package is no longer available.
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found on the GitHub runner."
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}" --licenses
          sdk_status=${PIPESTATUS[1]}
          if [ "$sdk_status" -ne 0 ]; then
            echo "::error::sdkmanager license acceptance failed with exit code $sdk_status"
            exit "$sdk_status"
          fi

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if { [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; } && [ -d "app" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif { [ -f "CyberOpsLock/settings.gradle" ] || [ -f "CyberOpsLock/settings.gradle.kts" ]; } && [ -d "CyberOpsLock/app" ]; then
            echo "dir=CyberOpsLock" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find Android project. Expected settings.gradle(.kts) and app/ at repository root or in CyberOpsLock/."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberOpsLock-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
