name: CyberOpsLock APK Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build CyberOpsLock debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if { [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; } && [ -d "app" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif { [ -f "CyberOpsLock/settings.gradle" ] || [ -f "CyberOpsLock/settings.gradle.kts" ]; } && [ -d "CyberOpsLock/app" ]; then
            echo "dir=CyberOpsLock" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Android project not found. Expected settings.gradle(.kts) and app/ at repository root or inside CyberOpsLock/."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          status=${PIPESTATUS[1]}
          if [ "$status" -ne 0 ]; then
            echo "::error::sdkmanager --licenses failed with exit code $status"
            exit "$status"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberOpsLock-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
