name: CyberOpsLock APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/**'
      - 'CyberOpsLock/**'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build CyberOpsLock debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project folder
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle" ] && [ -d "app" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "CyberOpsLock/settings.gradle" ] && [ -d "CyberOpsLock/app" ]; then
            echo "dir=CyberOpsLock" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find Android project root."
            echo "Upload the extracted project files, not only the ZIP archive."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberOpsLock-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
